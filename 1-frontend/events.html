<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活動列表 · 校園活動管理系統 · 馬君霖 ICT SBA</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="events" class="bg-body-tertiary">
  <div id="ces-nav"></div>

  <main class="ces-page container-xxl">
    <!-- 標題 -->
    <div class="ces-toolbar">
      <h1 class="section-title mb-0">校園活動</h1>
      <span class="muted small" id="eventsCount"></span>
      <div class="ms-auto">
        <a href="dashboard.html" class="btn btn-sm btn-ces-ghost">
          <i class="bi bi-calendar3"></i> 返回主頁
        </a>
      </div>
    </div>

    <!-- 篩選列 -->
    <div class="filter-bar">
      <ul class="nav nav-pills gap-1" id="eventTabs" role="tablist" aria-label="活動篩選">
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link active" data-tab="all" role="tab" aria-selected="true">全部活動</button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" data-tab="eligible" role="tab" aria-selected="false">符合資格</button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" data-tab="joined" role="tab" aria-selected="false">已參加</button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" data-tab="notjoined" role="tab" aria-selected="false">未參加</button>
        </li>
      </ul>

      <div class="ms-auto d-flex flex-wrap align-items-center gap-2">
        <div class="input-group input-group-sm flex-grow-1" role="search">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" id="searchInput" placeholder="搜尋活動名稱 / 編號 / 地點"
                 aria-label="搜尋活動">
        </div>
        <select class="form-select form-select-sm w-auto" id="sortSelect" aria-label="排序方式">
          <option value="time">時間（近→遠）</option>
          <option value="timeDesc">時間（遠→近）</option>
          <option value="eligDesc">資格（大範圍→小範圍）</option>
          <option value="eligAsc">資格（小範圍→大範圍）</option>
          <option value="latest">最新（新建立優先）</option>
        </select>
      </div>

      <!-- v1.5：多維篩選（類別 / 地點 / 時間段） -->
      <div class="filter-row mt-2 d-flex flex-wrap align-items-end gap-2">
        <div class="filter-field">
          <label class="form-label small mb-1" for="filterCategory">類別</label>
          <select class="form-select form-select-sm" id="filterCategory" aria-label="依類別篩選">
            <option value="">全部類別</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label small mb-1" for="filterLocation">地點</label>
          <select class="form-select form-select-sm" id="filterLocation" aria-label="依地點篩選">
            <option value="">全部地點</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label small mb-1" for="filterFrom">活動日期（起）</label>
          <input type="date" class="form-control form-control-sm" id="filterFrom" aria-label="活動日期起">
        </div>
        <div class="filter-field">
          <label class="form-label small mb-1" for="filterTo">活動日期（迄）</label>
          <input type="date" class="form-control form-control-sm" id="filterTo" aria-label="活動日期迄">
        </div>
        <button type="button" class="btn btn-sm btn-ces-ghost" id="filterReset">
          <i class="bi bi-x-circle"></i> 清除篩選
        </button>
        <div class="ms-auto filter-active" id="filterActiveHint"></div>
      </div>
    </div>

    <!-- 載入中 -->
    <div id="eventsLoading" class="ces-loading"></div>

    <!-- 列表 -->
    <div id="eventsPanel" class="d-none">
      <div class="ces-card">
        <!-- 桌面：表格 -->
        <div class="table-responsive d-none d-lg-block">
          <table class="table table-ces align-middle">
            <caption class="visually-hidden">校園活動列表</caption>
            <thead>
              <tr>
                <th scope="col">活動編號</th>
                <th scope="col">活動名稱</th>
                <th scope="col">類別</th>
                <th scope="col">時間</th>
                <th scope="col">地點</th>
                <th scope="col">人數 &amp; 限制</th>
                <th scope="col">資格</th>
                <th scope="col">我的狀態</th>
                <th scope="col" class="text-end">操作</th>
              </tr>
            </thead>
            <tbody id="eventsTableBody"></tbody>
          </table>
        </div>

        <!-- 行動裝置：卡片 -->
        <div id="eventsCards" class="ces-grid cols-2 d-lg-none"></div>

        <!-- 空狀態 -->
        <div id="eventsEmpty" class="ces-empty d-none">
          <i class="bi bi-inbox"></i>
          <span id="eventsEmptyText">暫時沒有活動</span>
        </div>
      </div>
    </div>

    <!-- 錯誤 -->
    <div id="eventsError" class="d-none"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/event.js"></script>
</body>
</html>
