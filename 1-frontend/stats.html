<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>數據報表 · 校園活動管理系統</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="stats" class="bg-body-tertiary">
  <div id="ces-nav"></div>

  <main class="ces-page container-xxl">
    <!-- 頁首 -->
    <section class="ces-hero">
      <h1><i class="bi bi-bar-chart-line me-2"></i>數據報表</h1>
      <p>活動參與人次、出席率與班級／分類統計（資料來源：getDashboardStats）。</p>
      <div class="ces-hero-meta mt-2" id="statsHeroMeta"></div>
    </section>

    <!-- 統計卡 -->
    <div class="ces-stat-grid">
      <div class="ces-stat">
        <div class="ces-stat-value" id="statEvents">—</div>
        <div class="ces-stat-label">活動總數</div>
        <div class="muted small mt-1" id="statEventsSub">開放中 —</div>
      </div>
      <div class="ces-stat stat-amber">
        <div class="ces-stat-value" id="statRegistrations">—</div>
        <div class="ces-stat-label">總報名人次</div>
        <div class="muted small mt-1" id="statRegistrationsSub">含候補人次</div>
      </div>
      <div class="ces-stat stat-green">
        <div class="ces-stat-value" id="statConfirmed">—</div>
        <div class="ces-stat-label">已確認人次</div>
        <div class="muted small mt-1" id="statConfirmedSub">已出席 —</div>
      </div>
      <div class="ces-stat stat-red">
        <div class="ces-stat-value" id="statAttendance">—</div>
        <div class="ces-stat-label">平均出席率</div>
        <div class="muted small mt-1" id="statAttendanceSub">出席 / 已確認</div>
      </div>
    </div>

    <!-- 圖表：餅圖 + 班級柱狀圖 -->
    <div class="ces-grid cols-2">
      <div class="ces-card">
        <div class="ces-card-title">
          <span><i class="bi bi-pie-chart me-1"></i><span id="attendanceChartTitle">已開始活動的出席情況</span></span>
          <span class="muted small" id="attendanceChartSub">已出席 vs 未出席</span>
        </div>
        <div class="ces-empty d-none" id="attendanceEmpty">
          <i class="bi bi-pie-chart"></i>暫無已確認的報名資料
        </div>
        <canvas id="chartAttendance" aria-label="出席情況餅圖" role="img"></canvas>
      </div>
      <div class="ces-card">
        <div class="ces-card-title">
          <span><i class="bi bi-bar-chart me-1"></i>各班級參與人次</span>
          <span class="muted small">依學生班級統計</span>
        </div>
        <div class="ces-empty d-none" id="byClassEmpty">
          <i class="bi bi-bar-chart"></i>暫無班級參與資料
        </div>
        <canvas id="chartByClass" aria-label="各班級參與人次柱狀圖" role="img"></canvas>
      </div>
    </div>

    <!-- 圖表：分類橫向柱狀圖 -->
    <div class="ces-card">
      <div class="ces-card-title">
        <span><i class="bi bi-tags me-1"></i>分類報名統計</span>
        <span class="muted small">各活動類別的報名情況</span>
      </div>
      <div class="ces-empty d-none" id="byCategoryEmpty">
        <i class="bi bi-tags"></i>暫無分類統計資料
      </div>
      <canvas id="chartByCategory" aria-label="分類報名統計橫向柱狀圖" role="img"></canvas>
    </div>

    <!-- 活動明細 -->
    <div class="ces-card">
      <div class="ces-card-title">
        <span><i class="bi bi-table me-1"></i>活動明細</span>
        <span class="muted small">出席率 = 已出席 / 已確認</span>
      </div>
      <div class="table-responsive">
        <table class="table table-ces align-middle">
          <thead>
            <tr>
              <th scope="col">活動名稱</th>
              <th scope="col">已確認</th>
              <th scope="col">候補</th>
              <th scope="col">已出席</th>
              <th scope="col">出席率</th>
            </tr>
          </thead>
          <tbody id="statEventTableBody">
            <tr><td colspan="5" class="text-center text-muted py-4">載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
