<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活動詳情 · 校園活動管理系統</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="event-detail" class="bg-body-tertiary">
  <div id="ces-nav"></div>

  <main class="ces-page container-xxl">
    <!-- 載入中 -->
    <div id="detailLoading" class="ces-loading"></div>

    <!-- 錯誤 / 空狀態 -->
    <div id="detailError" class="d-none"></div>

    <!-- 詳情內容 -->
    <div id="detailRoot" class="d-none">
      <div id="detailHero"></div>

      <div class="row g-3 mt-1">
        <div class="col-lg-8">
          <div class="ces-card">
            <h2 class="ces-card-title"><span><i class="bi bi-info-circle me-1"></i>活動資訊</span></h2>
            <div class="table-responsive">
              <table class="table table-ces mb-0">
                <caption class="visually-hidden">活動詳細資料</caption>
                <tbody id="detailInfoBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="ces-card" id="actionCard">
            <h2 class="ces-card-title"><span><i class="bi bi-pencil-square me-1"></i>報名狀態</span></h2>
            <div id="actionBody"></div>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <a class="btn btn-ces-ghost" href="events.html">
          <i class="bi bi-arrow-left"></i> 返回活動列表
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/event.js"></script>
</body>
</html>
