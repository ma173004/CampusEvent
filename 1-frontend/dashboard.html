<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主頁 · 校園活動管理系統 · 馬君霖 ICT SBA</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" class="bg-body-tertiary">
  <div id="ces-nav"></div>

  <main class="ces-page container-xxl">
    <!-- 歡迎區 -->
    <section class="ces-hero" aria-labelledby="heroGreeting">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
          <h1 id="heroGreeting">你好，同學</h1>
          <p id="heroSub">以下是你的校園活動概況</p>
        </div>
        <div class="ces-hero-meta text-lg-end">
          <div id="heroDate">—</div>
          <div id="heroRole">—</div>
        </div>
      </div>
    </section>

    <!-- 統計卡 -->
    <div class="ces-stat-grid" aria-label="我的活動統計">
      <div class="ces-stat stat-red">
        <div class="ces-stat-value" id="statJoined">—</div>
        <div class="ces-stat-label" id="statJoinedLabel">我的活動數</div>
      </div>
      <div class="ces-stat stat-amber">
        <div class="ces-stat-value" id="statUpcoming">—</div>
        <div class="ces-stat-label" id="statUpcomingLabel">即將舉行</div>
      </div>
      <div class="ces-stat stat-green">
        <div class="ces-stat-value" id="statConfirmed">—</div>
        <div class="ces-stat-label" id="statConfirmedLabel">已報名</div>
      </div>
      <div class="ces-stat">
        <div class="ces-stat-value" id="statTodo">—</div>
        <div class="ces-stat-label" id="statTodoLabel">待辦（可報名）</div>
      </div>
    </div>

    <div class="row g-3">
      <!-- 月曆 -->
      <div class="col-lg-8">
        <div class="calendar-hint"><i class="bi bi-arrow-left-right me-1"></i>畫面較窄時，可左右滑動月曆查看整週</div>
        <div class="calendar-wrap">
          <h2 class="ces-card-title">
            <span><i class="bi bi-calendar3 me-1"></i>活動月曆</span>
            <a href="events.html" class="small">活動列表 <i class="bi bi-arrow-right-short"></i></a>
          </h2>
          <div id="dashboardCalendar" class="ces-loading" aria-label="活動月曆"></div>
          <div class="calendar-legend">
            <span><span class="legend-dot is-holiday"></span>公眾假期（紅日）</span>
            <span><span class="legend-dot is-host"></span>我主持的活動</span>
            <span><span class="legend-dot is-joined"></span>我已報名 / 候補的活動</span>
            <span><span class="legend-dot is-mandatory"></span>必須參加</span>
          </div>
        </div>
      </div>

      <!-- 即將舉行的活動 -->
      <div class="col-lg-4">
        <div class="ces-card h-100">
          <h2 class="ces-card-title">
            <span><i class="bi bi-clock-history me-1"></i>即將舉行的活動</span>
            <a href="events.html" class="small">全部 <i class="bi bi-arrow-right-short"></i></a>
          </h2>
          <div id="upcomingList" class="ces-loading" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/zh-tw.global.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/calendar.js"></script>
</body>
</html>
